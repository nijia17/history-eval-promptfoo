- description: 冷门人物：顾恺之
  vars:
    person: 顾恺之
    facts: |-
      出生时间：约公元348年
      主要经历：顾恺之字长康，小字虎头，晋陵无锡人，出身官宦家庭，父顾悦之为尚书左丞。顾恺之博学有才气，工诗赋、善书法，尤精绘画。太和元年（366年）为大司马桓温参军，后为殷仲堪参军。义熙年间官至散骑常侍。顾恺之画人物尤善点睛，曾言传神写照正在阿堵中。其在建康瓦官寺绘维摩诘像，光彩耀目，施者填咽。顾恺之著有《画论》《魏晋胜流画赞》《画云台山记》等绘画理论著作，提出以形写神、迁想妙得等美学命题。约卒于义熙五年（409年）。顾恺之生卒年史载不一，学界多取约348至409年之说。
      历史贡献：顾恺之是东晋最杰出的画家与绘画理论家，其以形写神、传神写照、迁想妙得等理论观点成为中国绘画的审美核心，奠定了中国人物画的理论基础。其绘画作品与理论著作对后世中国画的发展产生了极为深远的影响，被后世尊为中国绘画理论的奠基人。
      历史评价：后世对顾恺之评价极高，多赞其才绝、画绝、痴绝。唐代张彦远在《历代名画记》中对其画艺推崇备至。亦有论者指其部分事迹带有传说色彩。总体而言，顾恺之被视为中国绘画史上最具影响力的理论家与画家之一。
