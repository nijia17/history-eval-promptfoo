- description: 冷门人物：赵孟頫
  vars:
    person: 赵孟頫
    facts: |-
      出生时间：公元1254年
      主要经历：赵孟頫字子昂，号松雪道人，吴兴人，宋太祖赵匡胤十一世孙。赵孟頫自幼聪敏，读书过目成诵。宋末以父荫补官，任真州司户参军。宋亡后家居力学。至元二十三年（1286年）程钜夫奉诏搜访江南遗逸，赵孟頫被荐入朝，受元世祖忽必烈赏识，授兵部郎中。至元二十九年（1292年）出任济南路总管府事。大德年间累迁集贤直学士、江浙等处儒学提举。至大三年（1310年）召入翰林，拜翰林侍读学士。延祐三年（1316年）官至翰林学士承旨、荣禄大夫，封魏国公。至治二年（1322年）病逝，享年六十九岁，谥文敏。
      历史贡献：赵孟頫是元代最杰出的书画家，在书法上精研各体，创赵体楷书，与颜真卿、柳公权、欧阳询并称楷书四大家。在绘画上倡导古意，主张作画贵有古意，开辟了文人画的全盛时代。其书画艺术对后世影响极为深远，在诗文、音律方面亦有成就。赵孟頫为元代文艺的领袖人物，对中国书画艺术的发展起到了承前启后的作用。
      历史评价：后世对赵孟頫评价褒贬兼有。肯定者赞其为元代书画宗师，其赵体书法与文人画理论影响深远。批评者指其以宋宗室身份仕元，气节有亏。亦有论者认为其艺术成就超越道德争议。总体而言，赵孟頫被视为中国书画史上承前启后的关键人物。
