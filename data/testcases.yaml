    facts: |-
      出生时间：公元624年
      主要经历：武则天为荆州都督武士彟次女。十四岁入宫为唐太宗才人。太宗崩后入感业寺为尼。唐高宗即位后被召回宫，封昭仪。永徽六年（655年）被立为皇后。上元元年（674年）加号天后，与高宗并称二圣，参预朝政。高宗崩后以皇太后身份临朝称制。天授元年（690年）自称圣神皇帝，改国号为周，定都洛阳。在位期间开创殿试、武举，薄赋敛、息干戈，复安西四镇。神龙元年（705年）张柬之等发动神龙革命，迫其退位。同年十一月崩于上阳宫，享年八十二岁，遗命去帝号，以皇后身份入葬乾陵。
      历史贡献：武则天是中国历史上唯一的正统女皇帝，前后当政四十余年。政治上打击门阀世族，扶植庶族官僚，开创殿试与武举制度，扩大统治基础。经济上重视农桑，轻徭薄赋，使社会经济持续发展。军事上收复安西四镇，维护边疆稳定。其统治上承贞观之治，下启开元盛世。
      历史评价：武则天以女性身份君临天下，后世对其评价两极。肯定者称其政启开元、治宏贞观，为盛唐奠定基础。批评者指其任用酷吏、诛杀宗室，晚年弊政渐生。然其政治才能与治国功绩，历代史家多有认可。
