- description: 冷门人物：徐光启
  vars:
    person: 徐光启
    facts: |-
      出生时间：公元1562年
      主要经历：徐光启字子先，号玄扈，上海人，出身农家。万历九年（1581年）中秀才，万历二十五年（1597年）中举人，万历三十二年（1604年）中进士，时年四十三岁。在科举失意期间，徐光启一面课馆教书，一面刻苦求学，涉猎古今，并接触传教士学习西学。万历三十一年（1603年）在南京受洗加入天主教。万历三十四年（1606年）与利玛窦合译《几何原本》前六卷，次年译成刊行。崇祯元年（1628年）充日讲官，为天子师，后升礼部左侍郎、礼部尚书。崇祯五年（1632年）以礼部尚书兼东阁大学士入阁，参与机要。崇祯六年（1633年）病逝于北京，享年七十二岁。
      历史贡献：徐光启是明代杰出的科学家与政治家，在天文、历法、数学、农学及火炮制造等方面均有重要贡献。与利玛窦合译《几何原本》，首次将欧几里得几何学及其逻辑体系引入中国。所著《农政全书》集中国传统农学之大成，对后世农学发展影响深远。其经世致用的学术道路开启了中西科学交流的先河。
      历史评价：后世对徐光启评价甚高，多赞其学贯中西、经世致用，为中国近代科学的先驱。史家肯定其在引进西方科学知识方面的开创性贡献。亦有论者指出其科学活动受时代局限，部分著作未及定稿。总体而言，徐光启被视为明末最具影响力的科学家与中西文化交流的开拓者。
