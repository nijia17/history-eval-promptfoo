      主要经历：玄烨生于紫禁城景仁宫，为顺治帝第三子。顺治十八年（1661年）八岁即位，年号康熙，由索尼等四大臣辅政。康熙六年（1667年）十四岁亲政。康熙八年（1669年）智擒鳌拜，夺回大权。康熙十二年（1673年）下令撤藩，历经八年平定三藩之乱。康熙二十二年（1683年）派施琅收复台湾。康熙二十九年（1690年）、三十五年（1696年）、三十六年（1697年）三次亲征噶尔丹，平定漠北。康熙二十八年（1689年）签订《尼布楚条约》，划定中俄东段边界。康熙六十一年（1722年）病逝于畅春园，享年六十九岁，在位六十一年，为中国历史上在位时间最长的皇帝。
      历史贡献：康熙帝平定三藩、收复台湾、三征噶尔丹，维护了国家统一与领土完整。重视农业，蠲免赋税，治理黄河，推行滋生人丁永不加赋政策。组织编纂《康熙字典》《古今图书集成》《全唐诗》等，推动文化事业。雅克萨之战后签订《尼布楚条约》，以法律形式确立中俄边界。
      历史评价：康熙帝被后世誉为千古一帝，其文治武功为清朝盛世奠定坚实基础。然晚年吏治松弛、九子夺嫡之祸亦为史家所叹。总体而言，其统治时期是中国封建社会最后一个鼎盛阶段。
