      出生时间：公元1037年1月8日
      主要经历：苏轼生于眉州眉山，父苏洵为北宋文学家。嘉祐二年（1057年）进士及第。嘉祐六年（1061年）授大理评事、签书凤翔府判官。宋神宗时历任杭州、密州、徐州、湖州等地官职。元丰二年（1079年）因乌台诗案入狱，次年被贬黄州团练副使。宋哲宗即位后，出任兵部尚书、礼部尚书等职，外放治理杭州、颍州、扬州、定州。新党执政后，又贬惠州、儋州。宋徽宗时获赦北还，建中靖国元年（1101年）病逝于常州，年六十六。南宋追赠太师，谥文忠。
      历史贡献：苏轼是北宋中期文坛领袖，在诗、词、文、书、画各领域均取得极高成就。其词开豪放一派，与辛弃疾并称苏辛；其文纵横恣肆，为唐宋八大家之一；书法与黄庭坚、米芾、蔡襄合称宋四家。主政地方时疏浚西湖、修筑苏堤，兴修水利，赈济灾民，政绩卓著。
      历史评价：苏轼文学成就冠绝北宋，诗词文书画皆臻化境，对后世影响深远。其历经坎坷而旷达超然的人生态度，更为后世文人仰慕。宋孝宗评其雄视百代、自作一家。
