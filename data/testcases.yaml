- description: 冷门人物：吴道子
  vars:
    person: 吴道子
    facts: |-
      出生时间：约公元685年
      主要经历：吴道子又名道玄，阳翟人。少年孤贫，年未弱冠已穷丹青之妙，初在韦嗣立处为小吏，后任兖州邱尉。唐玄宗闻其名，召入宫中供奉，任内教博士，由此名振天下。开元年间，吴道子主要从事宗教壁画创作，在长安、洛阳等地寺观绘制大量壁画，题材涵盖佛道人物、山水、楼阁、草木、鸟兽。开元十三年（725年）随玄宗东封泰山，途经潞州金桥。相传他曾在洛阳观舞剑名家裴旻舞剑，画兴大发，挥毫作画；又曾于大同殿一日之内画成嘉陵江三百里山水。约卒于乾元二年（759年）前后。
      历史贡献：吴道子是唐代最杰出的画家，被后世尊为画圣。他精通山水、花鸟、建筑、人物等题材，尤擅佛道人物画，创作了大量精美的宗教壁画。其画风被称为吴带当风，所写衣褶有飘举之感，线条遒劲奔放，富有运动感与力量感。吴道子首创白描法，又创写意山水新风，对中国绘画艺术的发展影响极为深远。
      历史评价：后世对吴道子评价极高，多尊其为百代画圣，民间画工奉其为祖师。史家肯定其人物画与山水画的卓越成就，认为其画风契合了盛唐昂扬奋发的时代精神。亦有论者指出其画作真迹今已不存，今人所见多为后人摹本或石刻。总体而言，吴道子被视为中国绘画史上最伟大的画家之一。
