- description: 冷门人物：郭守敬
  vars:
    person: 郭守敬
    facts: |-
      出生时间：公元1231年
      主要经历：郭守敬字若思，顺德邢台人，出身书香世家，自幼由祖父郭荣抚养。十五岁时曾用竹篾仿制浑仪，十七岁拜刘秉忠为师。中统三年（1262年）经张文谦举荐，向忽必烈面陈水利六事，被任命为提举诸路河渠。至元元年（1264年）修复唐徕、汉延等古渠，使河套地区再现塞北江南景象。至元十三年（1276年）与王恂等主持编修新历，至元十七年（1280年）《授时历》颁行。至元二十八年（1291年）主持开凿通惠河，次年完工，京杭大运河全线贯通。延祐三年（1316年）卒，享年八十六岁。
      历史贡献：郭守敬是元代最杰出的科学家，在天文、历法、水利、数学等领域成就卓著。他主持编制的《授时历》测定一回归年为365.2425日，与现行公历值仅差约26秒，精度领先欧洲《格里高利历》三百余年。他主持了四海测验，设计制造了简仪、高表等多种天文仪器。在水利方面，他规划整治元大都水脉，开凿通惠河，奠定了此后七百余年北京城市供水与漕运的基本格局。
      历史评价：后世对郭守敬评价极高，多尊其为中国科学史上最杰出的人物。英国科技史家李约瑟称其为最伟大的科学家之一。史家肯定其在天文历法与水利工程方面的划时代贡献。亦有论者指出其科学成就的取得与元初重视实学的时代背景密切相关。总体而言，郭守敬被视为中国古代科技史上里程碑式的人物。
