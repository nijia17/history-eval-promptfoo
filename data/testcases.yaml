      主要经历：公元701年出生，出生地有蜀郡绵州昌隆县、西域碎叶等说法。五岁发蒙读书，十五岁已有诗赋多首并获名流推崇，好剑术、喜任侠。二十四五岁仗剑去国、辞亲远游，出蜀远游。三十岁赴长安求仕，谒宰相张说无果；后在长安结识贺知章，贺读其《蜀道难》后称其为谪仙人。742年受玉真公主、贺知章举荐，玄宗召其入宫，任翰林供奉。744年因遭权贵谗毁被赐金放还；同年夏在洛阳与杜甫相识。安史之乱中入永王李璘幕府，兵败后获罪流放夜郎。759年至白帝城遇赦获释，作《早发白帝城》。762年在当涂病逝，享年62岁。
