- description: 冷门人物：宋应星
  vars:
    person: 宋应星
    facts: |-
      出生时间：公元1587年
      主要经历：宋应星字长庚，江西奉新县人，出身书香门第。万历四十三年（1615年）中举，此后六试不第，遂绝科举之意。崇祯七年（1634年）任江西分宜教谕，在任四年期间致力于研究考察农业和手工业生产，收集丰富科学资料。崇祯十年（1637年）在友人资助下，《天工开物》正式刊刻问世。崇祯十一年（1638年）任福建汀州府推官，崇祯十四年（1641年）任安徽亳州知州。崇祯十七年（1644年）弃官返回奉新，隐居不仕。此后在贫困中度过晚年，约于康熙五年（1666年）去世，享年八十岁。
      历史贡献：宋应星所著《天工开物》共十八卷，系统记述了明代农业和手工业的生产技术与经验，附有一百二十三幅工艺流程插图，被誉为中国十七世纪的工艺百科全书。该书是中国第一部关于农业和手工业生产的综合性著作，被译成日、英、法、德等多种文字，对世界科技史研究具有重要价值。宋应星对封建传统学术持批判态度，其科学思想具有超前意识。
      历史评价：后世对宋应星评价甚高，多尊其为明末清初杰出的科学家，《天工开物》被誉为中国十七世纪工艺百科全书。史家肯定其注重实地考察、重视生产技术的科学精神。亦有论者惜其著作在清代命运多舛。总体而言，宋应星被视为中国古代科技史上的重要人物。
