      主要经历：谢安字安石，陈郡阳夏人，出身名门陈郡谢氏，父谢裒为太常卿。谢安少有重名，初辟司徒府，除佐著作郎，均以疾辞。隐居会稽东山二十余年，与王羲之、支遁等游处。年四十余始出仕，时人谓东山再起。历任吴兴太守、侍中、吏部尚书、中护军等职。太元八年（383年）前秦苻坚率大军南侵，谢安任征讨大都督，派谢玄等率北府兵迎战，在淝水之战中以少胜多，大败前秦。太元十年（385年）谢安病逝，享年六十六岁，谥文靖，追赠太傅。
