    facts: |-
      出生时间：公元前551年
      主要经历：公元前551年生于鲁国陬邑，3岁丧父，家境中落，15岁立志于学。年轻时曾任管粮仓、管放牧的小官。约30岁开始收授门徒，首开私人讲学之风。鲁定公九年任中都宰，后迁司空、大司寇；前500年齐鲁夹谷之会，孔子相礼，为鲁国收回失地；此后摄行相事，推行堕三都失败。因不满季氏专权，55岁离开鲁国，开始长达14年的周游列国，先后游历卫、匡、宋、曹、郑、陈、蔡、楚等国，其间经历陈蔡绝粮仍讲诵弦歌不衰。前484年被迎回鲁国，时年68岁，被尊为国老。晚年集中整理《诗》《书》《礼》《乐》《易》，删修《春秋》。前479年病逝，享年73岁，葬于鲁城北泗水岸边。
      历史贡献：创立儒家学派，首开平民教育先河，主张有教无类，相传弟子三千、通六艺者七十二人。思想核心为仁，以礼为行为规范，言论汇集于《论语》。其学说奠定中国传统文化的重要基础。
      历史评价：中国古代最具影响力的思想家、教育家，被尊为至圣先师。其思想成为两千余年中国社会的主流价值，并深刻影响东亚文化圈。
