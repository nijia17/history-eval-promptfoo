- description: 冷门人物：郦道元
  vars:
    person: 郦道元
    facts: |-
      出生时间：约公元466年
      主要经历：郦道元字善长，范阳涿县人，出身仕宦家庭，父郦范为青州刺史。太和十八年（494年）出任尚书郎，后历任颍川太守、东荆州刺史、河南尹、御史中尉等职。郦道元好学博览，为官执法清刻，不畏权贵。约延昌三年（514年）至正光五年（524年）间，郦道元以三国时期桑钦所著《水经》为纲，详细注释，撰成《水经注》四十卷。孝昌三年（527年）雍州刺史萧宝夤反状渐露，郦道元被任命为关右大使前往宣抚，途中被萧宝夤派人围困于阴盘驿亭，不屈而死。郦道元生年史载不详，学界一般取约466年之说。
      历史贡献：郦道元所著《水经注》四十卷是中国第一部以记载河道水系为主的综合性地理著作，详细叙述了一千二百多条河流的变迁与地理沿革，引用前人地理著作多达三百七十余种，并补充了大量实地考察资料。该书兼具地理学与文学价值，对后世地理学与山水文学的发展影响深远。
      历史评价：后世对郦道元评价甚高，多赞其《水经注》之宏富与文辞之清丽。清代学者称《水经注》为宇宙未有之奇书。亦有史家惜其执法过严致遭杀身之祸。总体而言，郦道元被视为中国古代最杰出的地理学家之一。
