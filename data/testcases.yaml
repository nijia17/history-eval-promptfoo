      主要经历：岳飞生于相州汤阴农家。少年时喜读《左传》与孙武兵书，习武艺。二十岁起先后四次从军抗金。建炎四年（1130年）收复建康。绍兴四年（1134年）率军收复襄阳六郡，授清远军节度使。绍兴十年（1140年）郾城之战大败金军主力，进军朱仙镇，中原震动。宋高宗与秦桧连发金牌促其班师。绍兴十一年（1141年）被解除兵权，授枢密副使。同年遭秦桧等人诬陷入狱，十二月二十九日（1142年1月27日）以莫须有罪名被害于临安大理寺，年仅三十九岁。宋孝宗时平反昭雪，追谥武穆，后追赠太师、鄂王。
