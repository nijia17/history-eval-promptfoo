      主要经历：王阳明生于浙江余姚官宦之家，父王华为南京吏部尚书。弘治十二年（1499年）中进士，历任刑部主事等职。正德元年（1506年）因忤宦官刘瑾，廷杖四十，贬贵州龙场驿丞。正德三年（1508年）在龙场大悟格物致知之旨，史称龙场悟道。正德十四年（1519年）平定宁王朱宸濠叛乱。嘉靖六年（1527年）总督两广军务，平定思恩、田州之乱。嘉靖七年（1529年）病逝于归途，享年五十七岁。隆庆时追谥文成，万历十二年从祀孔庙。
      历史贡献：王阳明创立阳明心学，提出心即理、知行合一、致良知三大命题，打破了程朱理学的思想垄断。其学说远播日本、朝鲜及东南亚，对东亚思想史影响深远。军事上平定宁王之乱与西南边患，展现文武兼备之才。教育上广收门徒，讲学不辍，推动明代学术繁荣。
      历史评价：王阳明被后世尊为真三不朽的完人，与孔子、孟子、朱熹并称孔孟朱王。其心学思想强调主体精神与道德实践，为明清思想解放开辟道路。
